# Builds the site from source on every push to main and publishes site/ to
# GitHub Pages.
#
# The build is run rather than trusted: engine/generate.mjs is deterministic at
# its fixed seed, so if the committed data/ and site/index.html ever drift from
# what the engine and the page source produce, this rebuild is what gets
# published — and the committed copies can be refreshed with `npm run build`.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the model and build the page
        run: npm run build

      - name: Remove the development-only contact sheet
        run: rm -f site/_figures-preview.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
